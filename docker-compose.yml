version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: teledoc_postgres
    environment:
      POSTGRES_USER: teledoc_user
      POSTGRES_PASSWORD: teledoc_password
      POSTGRES_DB: teledoc_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed_base_xml.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teledoc_user -d teledoc_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
